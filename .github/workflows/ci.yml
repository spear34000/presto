name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job: Linux hardware-backend build gate - CUDA (NVIDIA) + Vulkan
  # (NVIDIA/AMD/Intel) must always compile & link. Runtime GPU tests are not
  # possible on hosted runners (no GPUs); runtime coverage happens on
  # developer machines with real devices.
  # ---------------------------------------------------------------------------
  linux-hw-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit (nvcc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nvidia-cuda-toolkit
          nvcc --version

      - name: Install Vulkan SDK (LunarG)
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list
          sudo apt-get update -qq
          sudo apt-get install -y -qq vulkan-sdk
          glslc --version

      - name: Record environment
        run: |
          mkdir -p logs
          {
            echo "uname: $(uname -a)"
            echo "cmake: $(cmake --version | head -n1)"
            echo "gcc:   $(g++ --version | head -n1)"
            echo "nvcc:  $(nvcc --version | tail -n1)"
          } | tee logs/env.txt

      - name: Configure (CUDA + Vulkan backends)
        run: |
          set -o pipefail
          # single architecture keeps this compile gate fast; runtime builds
          # on real machines pick their own arches
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPRESTO_WITH_LLAMACPP=ON \
                -DPRESTO_WITH_CUDA=ON -DPRESTO_WITH_VULKAN=ON -DPRESTO_BUILD_TESTS=OFF \
                -DCMAKE_CUDA_ARCHITECTURES=80 \
                2>&1 | tee logs/01-configure.log

      - name: Build presto (compile + link check for hw backends)
        run: |
          set -o pipefail
          # low parallelism: nvcc + shader-gen concurrently exceed runner RAM
          cmake --build build --config Release --target presto --parallel 2 2>&1 | tee logs/02-build.log

      - name: Capability report
        run: ./build/presto version | tee logs/03-version.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux-hw-build
          path: logs/

  # ---------------------------------------------------------------------------
  # Job 1: fast gate - core parsers + unit tests, no heavy backends
  # ---------------------------------------------------------------------------
  ubuntu-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Record environment
        run: |
          mkdir -p logs
          {
            echo "uname: $(uname -a)"
            echo "cmake: $(cmake --version | head -n1)"
            echo "cxx:   $(g++ --version | head -n1)"
          } | tee logs/env.txt
          {
            echo "## ubuntu-core"
            echo '```'
            cat logs/env.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure (core only, no network-heavy deps)
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPRESTO_WITH_LLAMACPP=OFF 2>&1 | tee logs/01-configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee logs/02-build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./build/presto_tests 2>&1 | tee logs/03-tests.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ubuntu-core
          path: logs/

  # ---------------------------------------------------------------------------
  # Job 2: Windows - MSVC + llama.cpp backend + REAL GGUF token generation
  # ---------------------------------------------------------------------------
  windows-gguf:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Record environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          (cmake --version | Select-Object -First 1) | Tee-Object -FilePath logs/env.txt

      - name: Configure (llama.cpp pinned static)
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | Tee-Object -FilePath logs/01-configure.log
          exit $LASTEXITCODE

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath logs/02-build.log
          exit $LASTEXITCODE

      - name: Unit tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter presto_tests.exe | Select-Object -First 1
          & $exe.FullName 2>&1 | Tee-Object -FilePath logs/03-tests.log
          exit $LASTEXITCODE

      - name: Smoke - real GGUF generation
        shell: pwsh
        run: ./scripts/smoke_gguf.ps1

      # Tempo gate: decode throughput must stay above the floor or this is a
      # performance regression worth failing CI over.
      - name: Tempo gate (CPU baseline)
        shell: pwsh
        run: |
          $env:PRESTO_SMOKE = "1"
          $exe = Get-ChildItem -Recurse build -Filter presto.exe | Select-Object -First 1
          $out = & $exe.FullName bench models/stories260K.gguf --steps 96 --warmup 8 --runs 3 2>&1 |
              Tee-Object -FilePath logs/05-bench.log
          foreach ($l in $out) { Write-Host $l }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = ($out | Where-Object { $_ -like "*presto-bench*" } | Select-Object -First 1)
          if (-not $line) { Write-Host "FAILED: no bench marker"; exit 1 }
          $tps = [double]([regex]::Match($line, 'med_tps=([0-9.]+)').Groups[1].Value)
          Write-Host "med_tps=$tps floor=100"
          if ($tps -lt 100) { Write-Host "FAILED: tempo below floor"; exit 1 }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-gguf
          path: |
            logs/
            smoke-gguf.log

  # ---------------------------------------------------------------------------
  # Job 3: macOS Apple Silicon - MLX backend + REAL token generation
  # ---------------------------------------------------------------------------
  macos-mlx:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record environment
        run: |
          mkdir -p logs
          {
            echo "uname: $(uname -a)"
            echo "cpu:   $(sysctl -n machdep.cpu.brand_string)"
            echo "cmake: $(cmake --version | head -n1)"
            echo "cxx:   $(clang++ --version | head -n1)"
          } | tee logs/env.txt
          {
            echo "## macos-mlx"
            echo '```'
            cat logs/env.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure (llama.cpp + mlx backends)
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPRESTO_WITH_MLX=ON 2>&1 | tee logs/01-configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 3 2>&1 | tee logs/02-build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./build/presto_tests 2>&1 | tee logs/03-tests.log

      # pipefail guards against `| tee` masking smoke-script exit codes
      - name: Smoke - MLX real token generation
        run: |
          set -o pipefail
          bash scripts/smoke_mlx.sh 2>&1 | tee logs/04-smoke-mlx.log

      - name: Smoke - GGUF via Metal
        run: |
          set -o pipefail
          bash scripts/smoke_gguf.sh 2>&1 | tee logs/04-smoke-gguf.log

      - name: Tempo gate (Metal GGUF)
        run: |
          set -o pipefail
          PRESTO_SMOKE=1 ./build/presto bench models/stories260K.gguf --steps 96 --warmup 8 --runs 3 2>&1 |
              tee logs/05-bench.log
          tps=$(grep -o 'med_tps=[0-9.]*' logs/05-bench.log | cut -d= -f2)
          echo "med_tps=$tps floor=20"
          # calibrated: stories260K decodes ~29.5 tok/s on M1 Metal (sigma 3.7%)
          awk -v v="$tps" 'BEGIN { if (v+0 < 20) { print "FAILED: tempo below floor"; exit 1 } }'

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-macos-mlx
          path: |
            logs/
            smoke-gguf.log
            smoke-mlx.log
